global:
  resolve_timeout: 5m

route:
  receiver: "remediation-webhook"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: "remediation-webhook"
    webhook_configs:
      - url: "http://remediation-webhook.default.svc.cluster.local:5000/alert"
        send_resolved: true