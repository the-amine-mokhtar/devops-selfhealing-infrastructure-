apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engagement-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: engagement.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: engagement-backend, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: engagement-frontend, port: { number: 80 } }
